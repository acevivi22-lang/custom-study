<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="광야">
<title>광야</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* 광야 — 검은 바탕, 둥근 위젯, 아래 떠 있는 탭 4개(홈·계획·공부·기숙사)
   홈 맨 위 큰 위젯은 '히어로 슬롯': 지금은 기숙사. 나중에 다른 화면으로 바꾸려면 아래 HERO 한 줄만 고치면 된다.
   연습장 페이지들은 iframe으로 그대로 열리고, 색은 theme.css 다크 값을 쓴다. */
:root{--sh:#000;--card:#141414;--card2:#1b1b1b;--edge:#262626;--tx:#f2f2f2;--mt:#8a8a8a;--dim:#5a5a5a;--r:24px}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sh)}
body{color:var(--tx);font:15px/1.5 "Noto Sans KR","Apple SD Gothic Neo",-apple-system,sans-serif;overflow:hidden;
  display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top" "chips" "main" "tabs";padding-top:env(safe-area-inset-top,0px)}
.top{grid-area:top}.chips{grid-area:chips}main{grid-area:main}.tabs{grid-area:tabs}
body::after{display:none!important}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}

/* 머리줄 */
.top{display:flex;align-items:center;gap:10px;padding:14px max(20px,env(safe-area-inset-left,0px)) 10px}
.title{flex:1;margin:0;font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.mod .title{font-size:22px}
.cb{flex:none;width:46px;height:46px;border-radius:50%;border:1px solid var(--edge);background:var(--card2);display:grid;place-items:center;cursor:pointer;padding:0}
.cb svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.dpill{flex:none;height:46px;padding:0 16px;border-radius:23px;border:1px solid var(--edge);background:var(--card2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;white-space:nowrap}

/* 연습장 안 칩 */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 20px 10px}
.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;text-decoration:none;color:var(--mt);font-size:14px;font-weight:500;padding:8px 14px;border-radius:18px;border:1px solid var(--edge);background:var(--card)}
.chips a[aria-current="page"]{color:#000;background:var(--tx);border-color:var(--tx);font-weight:700}

main{min-height:0;position:relative}
.view{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
iframe.page{border:0;width:100%;height:100%;display:block;background:var(--sh)}

/* 위젯 */
.wg{max-width:720px;margin:0 auto;padding:4px 20px 28px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.w{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--tx);position:relative;overflow:hidden}
.w.span{grid-column:1/-1}
.w.sq{aspect-ratio:1/1;justify-content:space-between}
.wh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.wh b{font-size:16px;font-weight:600}
.wh span,.lbl{color:var(--mt);font-size:13px}
.go{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);display:grid;place-items:center;flex:none}
.go svg{width:16px;height:16px;stroke:var(--mt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:52px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:16px;font-weight:400;color:var(--mt);letter-spacing:0;margin-left:4px}
.nm{font-size:16px;font-weight:600;line-height:1.3}
.ring{width:64px;height:64px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hero{padding:14px}
.hero .wh{padding:2px 4px 0}
.hero iframe{border:0;width:100%;display:block;border-radius:16px;background:transparent}

/* 수련 기록 점 */
.months{display:grid;font-size:12px;color:var(--mt);height:16px}
.months span{white-space:nowrap}
.dots{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:5px 0;justify-items:center}
.dots i{width:5px;height:5px;border-radius:50%;background:#2c2c2c;display:block}
.dots i.pre{background:transparent}
.dots i.l1{background:#5a5a5a}
.dots i.l2{background:#b5b5b5}
.dots i.l3{background:#fff;box-shadow:0 0 6px 1px rgba(255,255,255,.75)}
.dots i.today{outline:1.5px solid #fff;outline-offset:2px}
.dots i.exam{background:transparent;box-shadow:inset 0 0 0 1.5px #fff;width:7px;height:7px;margin:-1px}
.foot{display:flex;gap:16px;flex-wrap:wrap;color:var(--mt);font-size:13px}
.foot b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}

/* 강의 레이스 */
.race{display:flex;flex-direction:column;gap:12px}
.rr{display:grid;grid-template-columns:64px minmax(0,1fr) 104px;gap:10px;align-items:center;text-decoration:none;color:var(--tx)}
.rr .n{font-size:14px}
.rr .v{text-align:right;font-size:13px;color:var(--mt);font-variant-numeric:tabular-nums;white-space:nowrap}
.rr .v b{color:var(--tx);font-weight:600}
.rr .v.bad b{text-decoration:underline;text-underline-offset:3px}
.trk{height:4px;border-radius:2px;background:#2a2a2a;position:relative}
.trk i{display:block;height:100%;border-radius:2px;background:#fff}
.trk u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--mt);border-radius:1px}

/* 한 줄 위젯 */
.row{flex-direction:row;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px}
.row .l{display:flex;flex-direction:column;min-width:0}
.row .l b{font-size:16px;font-weight:600}
.row .val{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .val small{font-size:14px;color:var(--mt);font-weight:400}

details.w summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details.w summary::-webkit-details-marker{display:none}
.datefix{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.datefix label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mt)}
.datefix input{font-size:16px;font-family:inherit;border:1px solid var(--edge);background:var(--card2);color:var(--tx);border-radius:12px;padding:8px 10px;min-height:44px;color-scheme:dark}
.note{font-size:12px;color:var(--dim);margin:0}

/* 공부 목록 */
.lib{max-width:720px;margin:0 auto;padding:4px 20px 28px;display:flex;flex-direction:column;gap:22px}
.grp h2{margin:0 0 8px 4px;font-size:13px;font-weight:500;color:var(--mt)}
.list{background:var(--card);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.it{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 14px;align-items:center;padding:13px 16px;text-decoration:none;color:var(--tx);border-top:1px solid var(--edge)}
.it:first-child{border-top:0}
.it:active{background:var(--card2)}
.it .ic{grid-row:span 2;width:40px;height:40px;border-radius:12px;background:var(--card2);border:1px solid var(--edge);display:grid;place-items:center;font-size:15px;font-weight:700}
.it b{font-size:15px;font-weight:600}
.it span{font-size:12.5px;color:var(--mt);font-variant-numeric:tabular-nums}
.it svg{grid-row:span 2;width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:1.8}

/* 떠 있는 탭 */
.tabs{padding:8px 20px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:420px;margin:0 auto;height:66px;border-radius:33px;background:var(--card);border:1px solid var(--edge);display:grid;grid-template-columns:repeat(4,1fr);align-items:center}
.tabs button{all:unset;cursor:pointer;height:100%;display:grid;place-items:center;position:relative;color:var(--dim)}
.tabs button svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--tx)}
.tabs button:focus-visible{outline:2px solid var(--tx);outline-offset:-8px;border-radius:24px}
.badge{position:absolute;top:13px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:var(--tx)}

@media (min-width:900px){.wg{grid-template-columns:repeat(4,1fr)}.w.span{grid-column:span 4}.w.sq{aspect-ratio:auto;min-height:190px;grid-column:span 2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<header class="top" id="top">
  <button class="cb" id="back" type="button" aria-label="뒤로" hidden><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <h1 class="title" id="title">광야</h1>
  <button class="dpill" id="ddaybtn" type="button" aria-label="시험까지 남은 날, 누르면 날짜 설정"></button>
</header>
<nav class="chips" id="chips" aria-label="이 묶음의 화면" hidden></nav>
<main>
  <section class="view" id="home">
    <div class="wg">
      <div class="w span hero">
        <div class="wh"><b id="heroT"></b><a class="go" id="heroGo" href="#" aria-label="전체 보기"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></a></div>
        <iframe id="heroF" title="히어로 위젯" scrolling="no"></iframe>
      </div>

      <a class="w sq" id="wToday" href="#pt">
        <div class="wh"><div class="ring"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" stroke="#2c2c2c" stroke-width="3" fill="none"/><circle id="ringC" cx="32" cy="32" r="28" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="175.9" stroke-dashoffset="175.9"/></svg><span id="ringT"></span></div></div>
        <div><div class="nm" id="todayNm"></div><div class="lbl" id="todaySub"></div></div>
      </a>
      <button class="w sq" id="wDday" type="button" style="text-align:left;font:inherit;cursor:pointer">
        <div class="big" id="dBig"></div>
        <div><div class="nm" id="dNm"></div><div class="lbl" id="dSub"></div></div>
      </button>

      <a class="w span" href="#pt" aria-label="시험까지의 모든 날 기록">
        <div class="months" id="months"></div>
        <div class="dots" id="dots" role="img" aria-label="수련 기록"></div>
        <div class="foot" id="foot"></div>
      </a>

      <div class="w span">
        <div class="wh"><b>12월 완강</b><span>세로 눈금은 오늘까지 계획</span></div>
        <div class="race" id="race"></div>
      </div>

      <a class="w span row" id="resume" href="#gc1"></a>

      <details class="w span" id="datepanel">
        <summary><b style="font-weight:600">날짜 설정</b><span class="lbl">1차 · 2차 · 광야 시작일</span></summary>
        <div class="datefix">
          <label>1차 시험일<input type="date" id="examdate"></label>
          <label>2차 시험일<input type="date" id="examdate2"></label>
          <label>광야 시작일<input type="date" id="wilddate"></label>
        </div>
        <p class="note" style="margin-top:10px">시험일은 2026년 일정(3/14, 6/13)을 기준으로 잡은 추정이다. Q-Net 공고가 나오면 고친다. 기록은 이 기기 브라우저에만 저장된다. 다른 기기로 옮길 때는 계획 → 밀렸을 때의 백업을 쓴다.</p>
      </details>
    </div>
  </section>
  <section class="view" id="study" hidden><div class="lib" id="lib"></div></section>
  <iframe class="page" id="frame" title="연습장" hidden></iframe>
</main>
<footer class="tabs"><nav id="tabs" aria-label="탭"></nav></footer>

<script src="plan-core.js"></script>
<script src="dorm-core.js"></script>
<script>
{
const P=window.PLAN;
// ── 히어로 슬롯: 홈 맨 위 큰 위젯. 다른 걸 넣고 싶으면 이 한 줄만 바꾼다 ──
const HERO={t:"기숙사",src:"dorm.html#mini",open:"dorm",ratio:200/320,extra:40};

const MODS=[
 {id:"pt",g:"p",t:"오늘 계획",ic:"今",src:"plan.html#today",d:"오늘 시간표와 체크"},
 {id:"pp",g:"p",t:"진도",ic:"進",src:"plan.html#progress",d:"강의·회독 진도 입력, 계획 대비"},
 {id:"pw",g:"p",t:"주간표",ic:"週",src:"plan.html#week",d:"12월 주간 목표"},
 {id:"pc",g:"p",t:"체크포인트",ic:"點",src:"plan.html#checkpoints",d:"시험까지 점검 5회"},
 {id:"pr",g:"p",t:"밀렸을 때",ic:"則",src:"plan.html#rules",d:"줄이는 순서, 최소 버전, 백업"},
 {id:"gc1",g:0,t:"1차 기출",ic:"1",src:"gichul.html#p1",d:"2020~2026 1차 7개년 4과목 1,120문제, 최종 정답 채점과 해설"},
 {id:"gox",g:0,t:"기출 OX",ic:"OX",src:"gichul.html#ox",d:"1차 기출 선지를 한 문장씩 O·X로. 틀린 문장만 다시 풀기"},
 {id:"gc2",g:0,t:"2차 기출",ic:"2",src:"gichul.html#p2",d:"2020~2026 2차 문제지, 80분 타이머, 문제별 답안 칸"},
 {id:"law",g:1,t:"관세법 OX",ic:"法",src:"amgi.html#law",d:"과세물건, 납세의무자, 제척기간, 탄력관세 등 조문 함정 OX"},
 {id:"lawmap",g:1,t:"관세법 지도·카드",ic:"圖",src:"lawmap.html",d:"13개 장 구조 지도와 조문 시트, 간격반복 플래시카드"},
 {id:"sy",g:1,t:"관세법 세율",ic:"率",src:"seyul.html",d:"세율 적용 순서 맞히기, 탄력관세 12종 비교표(칸 가리기), 칸 맞히기 퀴즈"},
 {id:"nk",g:1,t:"내국소비세",ic:"稅",src:"nk.html",d:"부가세·개소세·주세 구조 지도, 돈 흐름, 수입 세금 계산, OX"},
 {id:"trade",g:1,t:"무역영어",ic:"E",src:"amgi.html#inco",d:"인코텀즈 2020, UCP 600, CISG, 무역 용어"},
 {id:"trademap",g:1,t:"무역영어 지도",ic:"航",src:"trademap.html",d:"인코텀즈 11개 규칙 항로, 규칙 맞히기, 국제규범 카드"},
 {id:"hs",g:2,t:"관세율표",ic:"HS",src:"amgi.html#hs",d:"류 번호 ↔ 품목명 양방향, 부별 범위 선택, 전체 표"},
 {id:"hsm",g:2,t:"관세율표 암기식",ic:"暗",src:"hsm.html",d:"21부 97류 암기식과 류별 호·주, 품목 가리기, 간격 복습, 순서 맞히기"},
 {id:"tc",g:2,t:"통칙 타자",ic:"則",src:"tc.html",d:"통칙 1~6 따라치기, 키워드 힌트, 백지 복원"},
 {id:"val",g:2,t:"관세평가",ic:"價",src:"amgi.html#val",d:"제1~6방법, 가산·공제 요소 사례 문제"},
 {id:"jr",g:3,t:"정리노트",ic:"抄",src:"jeongri.html",d:"위원회·날짜·금액, 부가세 숫자, 무역규범 숫자, 회계 공식. 숫자 가리기"},
 {id:"wrong",g:3,t:"오답노트",ic:"×",src:"amgi.html#wrong",d:"관세법·관세평가·무역영어·관세율표에서 틀린 문제만 다시"},
 {id:"dorm",g:"d",t:"기숙사",ic:"舍",src:"dorm.html",d:"동료와 업적"}
];
const GNAME={0:"기출 · 실제 시험 문제",1:"1차 · 관세법 · 내소세 · 무역영어",2:"2차 · 관세율표 · 관세평가",3:"복습 · 정리노트 · 틀린 문제"};
// 탭: 홈 · 계획 · 공부(기출·1차·2차·복습) · 기숙사
const TABS=[
 {k:"h",t:"홈",svg:'<rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/>'},
 {k:"p",t:"계획",svg:'<rect x="3.5" y="5" width="17" height="15" rx="3.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><path d="M9 14.5l2 2 4-4"/>'},
 {k:"s",t:"공부",svg:'<path d="M4 5.5c2.7-1.3 5.3-1.3 8 0v14c-2.7-1.3-5.3-1.3-8 0z"/><path d="M12 5.5c2.7-1.3 5.3-1.3 8 0v14c-2.7-1.3-5.3-1.3-8 0z"/>'},
 {k:"d",t:"기숙사",svg:'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19.5c.6-3.3 2.8-5.3 5.5-5.3s4.9 2 5.5 5.3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M15.5 14.4c2.6-.4 4.5 1.4 5 4.6"/>'}
];
const tabOf=g=>g==="p"?"p":g==="d"?"d":"s";
const $=s=>document.querySelector(s);
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const raw=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const setRaw=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

function stats(){
  const a=get("cbStudy.v1",{}), wrongA=Object.keys(a.wrong||{});
  const nk=get("nk-quiz",{wrong:[],done:[]}), tcb=get("tc-best",{});
  const tcDone=Object.keys(tcb).filter(k=>k.startsWith("blank")&&tcb[k]>=90).length;
  const gc=get("gc-v1",{}), gk=Object.keys(gc), gOk=gk.filter(k=>gc[k].ok).length;
  const pre=p=>wrongA.filter(id=>id.startsWith(p)).length;
  return {gDone:gk.length,gOk,solved:a.solved||0,correct:a.correct||0,wrongA:wrongA.length,nkDone:(nk.done||[]).length,nkWrong:(nk.wrong||[]).length,tcDone,
    per:{law:pre("law-"),trade:pre("inco-"),hs:pre("hs-"),val:pre("val-")}};
}
function prog(m,s){
  if(m.g==="p"||m.g==="d")return {t:m.d};
  switch(m.id){
    case "gc1":return {t:`${s.gDone} / 1,120 · 맞힘 ${s.gOk}`,n:s.gDone,max:"1,120"};
    case "gox":{const r=get("gox-v1",{}),k=Object.keys(r);return {t:k.length?`${k.length} / 1,819문장 · 맞힘 ${k.filter(x=>r[x]===1).length}`:"1,819문장",n:k.length,max:"1,819"}}
    case "gc2":return {t:"2020~2026 · 4과목 문제지"};
    case "lawmap":{const n=Object.keys(get("law-srs",{})).length;return {t:`플래시카드 ${n} / 77장`,n,max:"77"}}
    case "trademap":{const g=get("inco-score",{ok:0,n:0});return {t:g.n?`규칙 맞히기 ${g.ok}/${g.n}`:"인코텀즈 11개 규칙"}}
    case "nk":return {t:`OX ${s.nkDone} · 틀림 ${s.nkWrong}`};
    case "tc":return {t:`백지 복원 90% 이상 ${s.tcDone} / 10`,n:s.tcDone,max:"10"};
    case "sy":{const g=get("sy-score",{ok:0,n:0});return {t:g.n?`칸 맞히기 ${g.ok}/${g.n}`:"탄력관세 12종 비교"}}
    case "hsm":{const r=get("hsm-srs",{}),k=Object.keys(r),td=P.key(new Date()),due=k.filter(x=>r[x].b===0||r[x].d<td||(r[x].d===td&&Date.now()-r[x].t>108e5)).length;return {t:k.length?`익힌 묶음 ${k.length} / 108${due?` · 오늘 복습 ${due}`:""}`:"21부 97류 · 호와 주",n:k.length,max:"108"}}
    case "jr":return {t:"8개 주제 · 숫자 가리기"};
    case "wrong":return {t:s.wrongA?`모인 오답 ${s.wrongA}개`:"아직 오답 없음"};
  }
  return {t:s.per[m.id]?`오답 ${s.per[m.id]}개`:"오답 없음"};
}
const dd=n=>n>0?`D-${n}`:n===0?"D-DAY":"끝";
const md=k=>{const d=P.parse(k);return`${d.getMonth()+1}월 ${d.getDate()}일`};

// ── 홈 위젯 ──
function wDday(T){
  const n1=P.diffDays(T,P.parse(P.exam1())),n2=P.diffDays(T,P.parse(P.exam2()));
  const first=n1>=0;
  $("#dBig").innerHTML=first?`${n1}<small>일</small>`:`${Math.max(0,n2)}<small>일</small>`;
  $("#dNm").textContent=first?`1차까지`:`2차까지`;
  $("#dSub").textContent=first?`${md(P.exam1())} · 2차 ${dd(n2)}`:md(P.exam2());
  $("#ddaybtn").textContent=first?`1차 ${dd(n1)}`:`2차 ${dd(n2)}`;
  $("#examdate").value=P.exam1();$("#examdate2").value=P.exam2();$("#wilddate").value=P.wildStart();
}
function wToday(S,T){
  const sc=P.sched(T,S),done=S.done[P.key(T)]||{};
  const n=new Date(),nm=n.getHours()*60+n.getMinutes();
  let tot=0,dm=0;sc.b.forEach(b=>{tot+=b.m;if(done[b.id])dm+=b.m});
  const live=b=>!b.t||(()=>{const[h,m]=b.t.split(":").map(Number);return h*60+m+b.m>nm})();
  let nb=sc.b.find(b=>!done[b.id]&&live(b)),late=false;
  if(!nb){nb=sc.b.find(b=>!done[b.id]);late=!!nb}
  const pct=tot?Math.round(dm/tot*100):0;
  $("#ringC").style.strokeDashoffset=(175.9*(1-pct/100)).toFixed(1);
  $("#ringT").textContent=pct+"%";
  $("#todayNm").textContent=nb?nb.title:dm>=tot?"오늘 끝":"남은 블록은 내일로";
  $("#todaySub").textContent=nb?(late?`남은 블록 · ${nb.m}분`:`${nb.t||nb.m+"분"}${nb.t?" · "+nb.m+"분":""}`):`${Math.floor(dm/60)}시간 ${dm%60}분`;
}
function wDots(S,T){
  const e1=P.exam1(),e2=P.exam2(),start=P.parse(P.PLAN_START),mon=P.add(start,-((start.getDay()+6)%7)),last=P.parse(e2);
  const cells=[],mons=[];let col=0,filled=0,d=new Date(mon);
  while(d<=last||(d.getDay()+6)%7!==0){
    const k=P.key(d),wd=(d.getDay()+6)%7;
    if(wd===0){col++;if(d.getDate()<=7||col===1)mons.push([col,d.getMonth()+1])}
    let c="";
    if(k<P.PLAN_START||d>last)c="pre";
    else if(k===e1||k===e2)c="exam";
    else if(d<=T){const r=P.dayRatio(d,S);if(r>=.9){c="l3";filled++}else if(r>=.6){c="l2";filled++}else if(r>0)c="l1"}
    if(k===P.key(T))c+=" today";
    cells.push(`<i class="${c.trim()}" title="${P.fmt(d)}"></i>`);
    d=P.add(d,1);
  }
  const g=$("#dots");g.style.gridTemplateColumns=`repeat(${col},minmax(0,1fr))`;g.innerHTML=cells.join("");
  const mo=$("#months");mo.style.gridTemplateColumns=`repeat(${col},minmax(0,1fr))`;
  mo.innerHTML=mons.map(([c,m])=>`<span style="grid-column:${c}">${m}월</span>`).join("");
  const wild=P.diffDays(P.parse(P.wildStart()),T)+1;
  $("#foot").innerHTML=`${wild>0?`<span>광야 <b>${wild}</b>일째</span>`:""}<span>연속 <b>${P.streak(S,T)}</b>일</span><span>채운 날 <b>${filled}</b></span>`;
}
function wRace(S,T){
  const rows=[{n:"회계학",ks:["jm","wg"],max:69},{n:"무역실무",ks:["mu"],max:73},{n:"관세평가",ks:["pg"],max:17}];
  $("#race").innerHTML=rows.map(r=>{
    const cur=r.ks.reduce((a,k)=>a+S.prog[k],0),e=r.ks.reduce((a,k)=>a+P.expected(k,T),0),dl=Math.round((cur-e)*10)/10;
    const st=Math.abs(dl)<=.5?"":dl>0?` · +${dl}`:` · ${dl}`;
    return`<a class="rr" href="#pp"><span class="n">${r.n}</span><div class="trk"><i style="width:${Math.min(100,cur/r.max*100)}%"></i><u style="left:${Math.min(99,e/r.max*100)}%"></u></div><span class="v${dl<-.5?" bad":""}"><b>${cur}</b>/${r.max}${st}</span></a>`}).join("");
}
function wResume(s){
  const lastId=raw("hub-last"),last=MODS.find(m=>m.id===lastId&&m.g!=="p"&&m.g!=="d");
  const m=last||MODS.find(x=>x.id==="gc1"),p=prog(m,s),r=$("#resume");r.href="#"+m.id;
  r.innerHTML=`<div class="l"><b>${last?m.t:"1차 기출"}</b><span class="lbl">${last?"이어서 하기":"처음이라면 여기부터"}</span></div>`+
    (p.n!==undefined?`<div class="val">${p.n}<small> / ${p.max}</small></div>`:`<div class="lbl" style="text-align:right">${p.t}</div>`);
}
function renderHome(){
  const s=stats(),S=P.load(),T=P.today();
  wDday(T);wToday(S,T);wDots(S,T);wRace(S,T);wResume(s);
}
function fitHero(){const f=$("#heroF");if(f.clientWidth)f.style.height=Math.round(f.clientWidth*HERO.ratio+HERO.extra)+"px"}

// ── 공부 목록 ──
const CHEV='<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
function renderLib(){
  const s=stats();
  $("#lib").innerHTML=[0,1,2,3].map(g=>`<div class="grp"><h2>${GNAME[g]}</h2><div class="list">${MODS.filter(m=>m.g===g).map(m=>
    `<a class="it" href="#${m.id}"><span class="ic">${m.ic}</span><b>${m.t}</b>${CHEV}<span>${prog(m,s).t}</span></a>`).join("")}</div></div>`).join("");
}

// ── 화면 전환 ──
function current(){const h=location.hash.slice(1);return h==="study"||MODS.some(m=>m.id===h)?h:"home"}
function tabNow(){const id=current();return id==="home"?"h":id==="study"?"s":tabOf(MODS.find(m=>m.id===id).g)}
function renderTabs(){
  const active=tabNow(),nu=window.DORM?DORM.unseen().length:0;
  $("#tabs").innerHTML=TABS.map(t=>`<button type="button" data-tab="${t.k}" aria-label="${t.t}" ${t.k===active?'aria-current="page"':""}><svg viewBox="0 0 24 24" aria-hidden="true">${t.svg}</svg>${t.k==="d"&&nu?'<span class="badge"></span>':""}</button>`).join("");
}
let loadedPage="";
function route(){
  const id=current(),f=$("#frame"),top=$("#top"),chips=$("#chips");
  ["home","study"].forEach(v=>$("#"+v).hidden=true);f.hidden=true;
  if(id==="home"||id==="study"){
    $("#"+id).hidden=false;top.classList.remove("mod");$("#back").hidden=true;chips.hidden=true;
    $("#title").textContent=id==="home"?"광야":"공부";
    if(id==="home"){renderHome();fitHero()}else renderLib();
    renderTabs();wDday(P.today());return;
  }
  const m=MODS.find(x=>x.id===id),page=m.src.split("#")[0];
  f.hidden=false;
  if(page===loadedPage&&f.contentWindow){f.contentWindow.location.hash=m.src.split("#")[1]||""}
  else{loadedPage=page;f.src=m.src}
  const tab=tabOf(m.g);
  top.classList.toggle("mod",tab==="s");$("#back").hidden=tab!=="s";
  $("#title").textContent=tab==="p"?"계획":tab==="d"?"기숙사":m.t;
  const sib=MODS.filter(x=>x.g===m.g);
  chips.hidden=sib.length<2;
  chips.innerHTML=sib.map(x=>`<a href="#${x.id}" ${x.id===id?'aria-current="page"':""}>${x.t}</a>`).join("");
  const cur=chips.querySelector("[aria-current]");if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
  if(m.g!=="d"&&m.g!=="p")setRaw("hub-last",id);
  if(tab==="p"){const lg=get("hub-lastg",{});lg.p=id;put("hub-lastg",lg)}
  renderTabs();wDday(P.today());
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-tab]");if(!b)return;
  const k=b.dataset.tab,lg=get("hub-lastg",{});
  if(k==="h"){location.hash="home";return}
  if(k==="s"){location.hash="study";return}
  if(k==="d"){location.hash="dorm";return}
  location.hash=lg.p&&MODS.some(m=>m.id===lg.p&&m.g==="p")?lg.p:"pt";
});
$("#back").onclick=()=>{location.hash="study"};
const openDates=()=>{if(current()!=="home")location.hash="home";setTimeout(()=>{const d=$("#datepanel");d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})},80)};
$("#ddaybtn").onclick=openDates;$("#wDday").onclick=openDates;
const onDate=(id,k)=>$(id).addEventListener("change",e=>{if(e.target.value){setRaw(k,e.target.value)}renderHome()});
onDate("#examdate","hub-exam");onDate("#examdate2","hub-exam2");onDate("#wilddate","hub-wild");

// 히어로 슬롯
$("#heroT").textContent=HERO.t;$("#heroGo").href="#"+HERO.open;$("#heroF").src=HERO.src;
window.addEventListener("resize",fitHero);

// 모든 연습장은 다크로
function syncTheme(fr){try{fr.contentDocument.documentElement.setAttribute("data-theme","dark")}catch(e){}}
$("#frame").addEventListener("load",()=>syncTheme($("#frame")));
$("#heroF").addEventListener("load",()=>syncTheme($("#heroF")));
window.addEventListener("hashchange",route);
window.addEventListener("focus",()=>{if(current()==="home")renderHome();renderTabs()});
window.addEventListener("storage",()=>{const id=current();if(id==="home")renderHome();if(id==="study")renderLib();renderTabs()});
setInterval(()=>{if(current()==="home")renderHome()},60000);
route();
}
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}
</script>
