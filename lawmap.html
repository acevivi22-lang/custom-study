<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관세법 지도</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script>(function(){if(window.self===window.top)return;var r=document.documentElement;try{var t=parent.document.documentElement.getAttribute("data-theme");if(t)r.setAttribute("data-theme",t)}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 법전 목차처럼 장(章) 띠를 세로로 쌓고, 누르면 아래 시트에 핵심 조문. 플래시카드는 카드 한 장 + 엄지 닿는 하단 버튼 */
:root{
  color-scheme:light;
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#5b6876; --line:#d5dbe2;
  --accent:#1f4e79; --accent-soft:#dbe6f1; --stamp:#b3261e; --stamp-soft:#f6dedb; --ok:#1d6b45; --ok-soft:#d9eee2; --warn:#8a5a00; --warn-soft:#f6ead2;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161c; --surface:#19212a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3743;
  --accent:#7fb0e0; --accent-soft:#1e3247; --stamp:#f08a80; --stamp-soft:#3e211f; --ok:#7fd1a4; --ok-soft:#173226; --warn:#e8c070; --warn-soft:#3a2f17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --ink:#e6ebf0; --muted:#97a3b0; --line:#2c3743;
  --accent:#7fb0e0; --accent-soft:#1e3247; --stamp:#f08a80; --stamp-soft:#3e211f; --ok:#7fd1a4; --ok-soft:#173226; --warn:#e8c070; --warn-soft:#3a2f17; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
[hidden]{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-block:14px 120px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:700;color:var(--muted);cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lead{color:var(--muted);font-size:.9rem;margin:0}

/* map */
.chap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.chap>button{width:100%;border:0;background:transparent;display:grid;grid-template-columns:3.2em 1fr auto;gap:10px;align-items:center;padding:14px;text-align:left;cursor:pointer;min-height:56px}
.chap .no{font-family:var(--f-mono);font-weight:600;color:var(--stamp);font-size:.85rem}
.chap .t{font-weight:700;line-height:1.35}
.chap .t small{display:block;font-weight:400;color:var(--muted);font-size:.78rem;font-family:var(--f-mono)}
.chap .cnt{font-family:var(--f-mono);font-size:.75rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.chap .nodes{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.node{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 12px;font-size:.88rem;cursor:pointer;min-height:40px}
.node .a{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);margin-left:4px}
.node.hot{border-color:var(--stamp)}
.node.hot::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--stamp);margin-left:6px;vertical-align:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--stamp);margin-right:4px;vertical-align:2px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:18px 18px 0 0;max-height:78vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:10px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
@media (min-width:800px){.sheet{left:50%;transform:translateX(-50%);width:720px;bottom:24px;border-radius:18px}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-family:var(--f-display);font-weight:900;font-size:1.3rem;margin:0;text-wrap:balance}
.sheet .art{font-family:var(--f-mono);color:var(--stamp);font-size:.8rem}
.sheet ul{margin:10px 0 0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.sheet li{word-break:keep-all;overflow-wrap:anywhere}
.sheet b{color:var(--accent)}
.sheet .trap{margin-top:12px;background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.9rem}
.sheet .trap strong{color:var(--warn)}
.sheet .row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;min-height:44px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}

/* cards */
.deckbar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.stat.due .v{color:var(--stamp)} .stat.new .v{color:var(--accent)} .stat.done .v{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;min-height:300px;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:22px;text-align:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:pan-y}
.card .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.card .front{font-family:var(--f-display);font-weight:900;font-size:1.3rem;line-height:1.5;text-wrap:balance;word-break:keep-all}
.card .back{border-top:1px dashed var(--line);padding-top:12px;font-size:1.08rem;font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.card .back .ref{display:block;margin-top:6px;font-family:var(--f-mono);font-size:.75rem;color:var(--stamp);font-weight:500}
.card .hint{font-size:.8rem;color:var(--muted)}
.rate{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.rate .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{border:0;border-radius:12px;padding:10px 4px;min-height:58px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button small{font-family:var(--f-mono);font-weight:500;font-size:.72rem;opacity:.8}
.r1{background:var(--stamp-soft);color:var(--stamp)} .r2{background:var(--warn-soft);color:var(--warn)} .r3{background:var(--ok-soft);color:var(--ok)} .r4{background:var(--accent-soft);color:var(--accent)}
.rate .show{grid-column:1/-1;background:var(--ink);color:var(--bg);min-height:52px;font-size:1rem}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.tools .note{font-size:.78rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
@media (prefers-reduced-motion:no-preference) and (min-width:800px){.sheet{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="seg" role="group" aria-label="보기 선택">
    <button type="button" id="v-map" aria-pressed="true">구조 지도</button>
    <button type="button" id="v-card" aria-pressed="false">플래시카드</button>
  </div>

  <section id="mapv">
    <div class="wrap" style="padding:0;gap:10px">
      <p class="lead">관세법 13개 장을 법전 순서대로 놓았어요. 장을 누르면 핵심 조문이 펼쳐지고, 조문을 누르면 숫자·함정·관련 기출이 아래에서 올라와요.</p>
      <div class="legend"><span><i></i>최근 3년 1차 기출에 자주 나온 조문</span></div>
      <div id="chaps" style="display:flex;flex-direction:column;gap:10px"></div>
    </div>
  </section>

  <section id="cardv" hidden>
    <div class="wrap" style="padding:0;gap:12px">
      <div class="deckbar">
        <div class="stat due"><div class="v" id="s-due">0</div><div class="k">복습할 카드</div></div>
        <div class="stat new"><div class="v" id="s-new">0</div><div class="k">오늘 새 카드</div></div>
        <div class="stat done"><div class="v" id="s-done">0</div><div class="k">익힌 카드</div></div>
      </div>
      <div class="card" id="card" role="button" tabindex="0" aria-live="polite"></div>
      <div class="tools">
        <span class="note">카드를 누르거나 스페이스로 뒤집기 · 1~4로 평가</span>
        <button type="button" class="btn" id="reset" style="min-height:36px;padding:6px 12px;font-size:.82rem">카드 기록 초기화</button>
      </div>
    </div>
  </section>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t" hidden></div>
<div class="rate" id="rate" hidden><div class="in" id="rate-in"></div></div>

<script src="gichul-data.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* ---------- 관세법 구조 ---------- */
const CH=[
 {no:"1장",t:"총칙",a:"제1조~제13조",n:[
  {t:"용어의 정의",a:"제2조",k:["용어의 정의","용어에 관한","외국물품인 것","탁송품"],p:["<b>수입</b>: 외국물품을 우리나라에 반입(보세구역 경유 시 보세구역에서 반입)하거나 우리나라에서 소비·사용","<b>반송</b>: 국내 도착 외국물품이 수입통관절차를 <b>거치지 않고</b> 다시 외국으로 반출","<b>내국물품</b>: 우리나라 물품으로 외국물품 아닌 것, 우리 선박이 공해에서 포획한 수산물, 입항전수입신고 수리 물품, 수입신고 수리 전 반출승인 물품, 즉시반출 물품","<b>탁송품</b>: 상업서류·견본품 등을 휴대 반출입 업자에게 위탁해 <b>우리나라에 반입</b>하는 물품"],trap:"'반송은 수입통관절차를 거쳐 반출'·'탁송품은 외국으로 반출'처럼 방향과 절차를 뒤집는 지문이 매년 나온다."},
  {t:"기간과 기한",a:"제8조",k:["기간과 기한","기간을 계산"],p:["수입신고수리전 반출승인을 받으면 그 <b>승인일</b>을 수리일로 본다","기한이 공휴일·토요일이면 <b>그 다음 날</b>이 기한","국가관세종합정보시스템 장애로 신고 불가 시 <b>장애 복구일의 다음 날</b>이 기한"],trap:"'그 전날', '복구된 날' 같은 하루 차이 함정."},
  {t:"관세의 납부기한",a:"제9조",k:["납부기한","월별납부"],p:["신고납부: 수입신고 <b>수리일부터 15일</b> 이내","납부고지: 고지를 <b>받은 날부터 15일</b> 이내","즉시반출: 수입신고일부터 15일 이내","월별납부: 승인 유효기간은 승인일부터 <b>2년</b>이 되는 날이 속하는 달의 말일까지"]},
  {t:"천재지변 등 기한연장",a:"제10조",k:["기한을 연장","기한연장"],p:["천재지변 등 사유로 신고·신청·납부를 못하면 <b>1년</b>을 넘지 않는 기간에서 연장"]}
 ]},
 {no:"2장",t:"과세가격과 관세의 부과·징수",a:"제14조~제48조",n:[
  {t:"과세물건 확정시기",a:"제16조",k:["확정의 시기","확정시기"],p:["원칙: <b>수입신고를 하는 때</b>","우편물: 통관우체국에 도착한 때","도난·분실물품: 도난되거나 분실된 때","보세운송기간 경과: 보세운송을 신고하거나 승인받은 때","즉시반출: 즉시반출신고를 한 때","매각물품: 매각된 때"],trap:"예외 시점끼리 바꿔 끼우는 지문(수취인 주소지 도착, 회수된 때 등)."},
  {t:"적용법령·환율",a:"제17조·제18조",k:["적용 법령","환율"],p:["적용법령: <b>수입신고 당시</b>의 법령(예외 시점은 그때 법령)","과세환율: 수입신고일이 속하는 주의 <b>전주</b> 기준환율 평균을 기초로 관세청장이 정함"]},
  {t:"납세의무자",a:"제19조",k:["납세의무자","연대하여"],p:["원칙: 수입신고 시의 <b>화주</b>","대행수입에서 화주 불분명: 수입을 <b>위탁한 자</b>","우편물: 수취인, 도난·분실 보세운송물품: 보세운송 신고·승인을 받은 자","공동사업 물품: 공동사업자 연대납부"],trap:"'위탁받은 자'로 바꾼 지문 주의."},
  {t:"제척기간·소멸시효",a:"제21조~제23조",k:["제척기간","소멸시효"],p:["부과 제척기간 <b>5년</b>(부정행위 10년)","징수권 소멸시효: 5억원 이상 <b>10년</b>, 그 외 <b>5년</b>","환급청구권 소멸시효 <b>5년</b>","분할납부·징수유예 기간 중에는 시효가 진행하지 않음"]},
  {t:"납세담보",a:"제24조~제26조",k:["납세담보","담보물","담보의 종류"],p:["종류: 금전, 국채·지방채, 유가증권, 납세보증보험증권, 토지, 보험 든 건물·공장재단 등, 보증인의 납세보증서","보증보험증권·보증서: 세관장 요청 시 언제든 지급한다는 내용이어야","포괄담보 제공 가능, 충당 후 잔액은 보증인에게 반환"]},

const NEW_PER_DAY=20;
const DAY=86400000;
let srs=get("law-srs",{}); // id -> {due, ivl, ease, reps}
let seenToday=get("law-srs-day",{d:"",n:0});
const today=()=>new Date().toISOString().slice(0,10);
if(seenToday.d!==today())seenToday={d:today(),n:0};
let current=null, flipped=false;
function queue(){
  const now=Date.now();
  const due=CARDS.filter(c=>srs[c.id]&&srs[c.id].due<=now).sort((a,b)=>srs[a.id].due-srs[b.id].due);
  const fresh=CARDS.filter(c=>!srs[c.id]);
  return {due,fresh,newLeft:Math.max(0,NEW_PER_DAY-seenToday.n)};
}
function stats(){
  const q=queue();
  $("#s-due").textContent=q.due.length;
  $("#s-new").textContent=Math.min(q.newLeft,q.fresh.length);
  $("#s-done").textContent=CARDS.filter(c=>srs[c.id]&&srs[c.id].ivl>=7).length;
}
function fmt(ivl){return ivl<1?"10분":ivl<30?Math.round(ivl)+"일":Math.round(ivl/30)+"달"}
function next(c,grade){
  const s=srs[c.id]||{ivl:0,ease:2.5,reps:0};
  let ivl,ease=s.ease;
  if(grade===1){ivl=0.007;ease=Math.max(1.3,ease-0.2)}
  else if(grade===2){ivl=s.reps?Math.max(1,s.ivl*1.2):1;ease=Math.max(1.3,ease-0.15)}
  else if(grade===3){ivl=s.reps?(s.ivl<1?1:s.ivl*ease):1}
  else {ivl=s.reps?(s.ivl<1?3:s.ivl*ease*1.3):3;ease+=0.15}
  return {ivl,ease,reps:grade===1?0:s.reps+1};
}
function pick(){
  const q=queue();
  current=q.due[0]||(q.newLeft>0?q.fresh[0]:null);flipped=false;render();
}
function render(){
  stats();
  const card=$("#card"),rate=$("#rate-in");
  if(!current){
    const q=queue();
    card.innerHTML=`<div class="empty">오늘 볼 카드를 모두 마쳤어요.<br>${q.fresh.length?`새 카드 ${q.fresh.length}장은 내일 ${NEW_PER_DAY}장씩 열려요.`:"전체 카드를 한 번씩 익혔어요."}</div>`;
    $("#rate").hidden=true;return}
  const isNew=!srs[current.id];
  card.innerHTML=`<span class="tag">${isNew?"새 카드":"복습"} · ${esc(current.r)}</span><div class="front">${esc(current.f)}</div>`+
    (flipped?`<div class="back">${esc(current.b)}<span class="ref">${esc(current.r)}</span></div>`:`<div class="hint">눌러서 답 보기</div>`);
  $("#rate").hidden=$("#cardv").hidden;
  if(!flipped){rate.innerHTML=`<button type="button" class="show" data-flip>답 보기</button>`;return}
  rate.innerHTML=[[1,"다시","r1"],[2,"어려움","r2"],[3,"알맞음","r3"],[4,"쉬움","r4"]].map(([g,l,c])=>
    `<button type="button" class="${c}" data-grade="${g}">${l}<small>${fmt(next(current,g).ivl)}</small></button>`).join("");
}
function grade(g){
  if(!current||!flipped)return;
  const wasNew=!srs[current.id];
  const n=next(current,g);
  srs[current.id]={...n,due:Date.now()+n.ivl*DAY};
  if(wasNew){seenToday.n++;put("law-srs-day",seenToday)}
  put("law-srs",srs);pick();
}
$("#card").addEventListener("click",()=>{if(current){flipped=!flipped;render()}});
$("#rate").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.hasAttribute("data-flip")){flipped=true;render()} else grade(+b.dataset.grade)});
// swipe on card: left = 다시, right = 알맞음 (after flip)
(function(){let x0=null;const c=$("#card");
 c.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
 c.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;
   if(Math.abs(dx)<70)return; if(!flipped){flipped=true;render();return} grade(dx<0?1:3)},{passive:true});})();
document.addEventListener("keydown",e=>{
  if($("#cardv").hidden)return;
  if(e.key===" "||e.key==="Enter"){e.preventDefault();if(current){flipped=!flipped;render()}}
  else if(/^[1-4]$/.test(e.key)&&flipped)grade(+e.key);
});
$("#reset").addEventListener("click",function(){
  if(this.dataset.armed){srs={};seenToday={d:today(),n:0};put("law-srs",srs);put("law-srs-day",seenToday);this.dataset.armed="";this.textContent="카드 기록 초기화";pick()}
  else{this.dataset.armed="1";this.textContent="한 번 더 누르면 초기화"}
});

/* ---------- 보기 전환 ---------- */
function view(v){
  const map=v!=="cards";
  $("#v-map").setAttribute("aria-pressed",map);$("#v-card").setAttribute("aria-pressed",!map);
  $("#mapv").hidden=!map;$("#cardv").hidden=map;$("#rate").hidden=map;
  if(!map){if(!current)pick();else render()}
  closeSheet();put("lawmap-view",v);
}
$("#v-map").onclick=()=>view("map");$("#v-card").onclick=()=>view("cards");
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h==="cards"||h==="map")view(h)});
renderMap();
view(location.hash.slice(1)==="cards"?"cards":get("lawmap-view","map"));
</script>
</body>
</html>
