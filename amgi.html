 {t:"mc",q:"신용장에서 보험 부보금액에 대한 요구가 없을 때 최소 부보금액은?",o:["CIF 또는 CIP 가격의 110%","상업송장 금액의 100%","CIF 가격의 120%","FOB 가격의 110%"],a:0,e:"UCP 600 제28조 f항 ii."},
 {t:"mc",q:"CISG(비엔나협약)에서 승낙의 효력이 발생하는 시점은?",o:["동의의 의사표시가 청약자에게 도달한 때","승낙 통지를 발송한 때","청약자가 승낙을 읽은 때","계약서에 서명한 때"],a:0,e:"CISG 제18조 2항. 도달주의."},
 {t:"mc",q:"\"Consignee\"의 뜻은?",o:["수하인","송하인","착화통지처","운송주선인"],a:0,e:"Shipper=송하인, Notify party=착화통지처, Freight forwarder=운송주선인."},
 {t:"mc",q:"\"Demurrage\"의 뜻은?",o:["체선료","조출료","정박기간","운임 할증"],a:0,e:"허용 정박기간(laytime)을 넘겨 선박을 붙잡아 둔 데 대한 배상금. 반대로 일찍 끝내면 despatch money(조출료)."},
 {t:"mc",q:"\"Clean B/L\"은?",o:["물품·포장에 하자 표시가 없는 무사고 선하증권","운임이 선지급된 선하증권","기명식 선하증권","본선적재 전 발행된 선하증권"],a:0,e:"하자 문구가 있으면 Foul(Dirty) B/L. 은행은 원칙적으로 clean 운송서류만 수리."},
 {t:"mc",q:"\"Negotiation\"(신용장 거래)의 뜻은?",o:["매입: 지정은행이 일치하는 제시에 대해 대금을 미리 지급하거나 지급을 약정하는 것","인수: 기한부 환어음에 지급을 약속하는 것","통지: 신용장을 수익자에게 전달하는 것","확인: 개설은행 외 은행이 지급을 추가로 확약하는 것"],a:0,e:"UCP 600 제2조 정의. Acceptance=인수, Advising=통지, Confirmation=확인."}

];

/* ---------- storage ---------- */
const KEY="cbStudy.v1";
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
const store=Object.assign({wrong:{},solved:0,correct:0},load());

/* ---------- question builders ---------- */
const CH=Object.keys(HS).map(Number);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const secOf=n=>SECTIONS.find(s=>n>=s[2]&&n<=s[3]);
function hsQ(n,mode){
  if(mode==="n2t"){
    const sec=secOf(n);
    const pool=shuffle(CH.filter(x=>x!==n));
    const near=pool.filter(x=>secOf(x)===sec).slice(0,2);
    const rest=pool.filter(x=>!near.includes(x)).slice(0,3-near.length);
    const opts=shuffle([n,...near,...rest]);
    return {id:"hs-n2t-"+n,t:"mc",code:String(n).padStart(2,"0")+"류",q:"이 류의 품목은?",o:opts.map(x=>HS[x]),a:opts.indexOf(n),e:`제${sec[0]}부 ${sec[1]} (${sec[2]}~${sec[3]}류)`};
  }
  const cand=shuffle(CH.filter(x=>x!==n&&Math.abs(x-n)<=6)).slice(0,3);
  const opts=shuffle([n,...cand]);
  const sec=secOf(n);
  return {id:"hs-t2n-"+n,t:"mc",q:HS[n],ask:"몇 류일까?",o:opts.map(x=>String(x).padStart(2,"0")+"류"),a:opts.indexOf(n),mono:true,e:`${String(n).padStart(2,"0")}류 · 제${sec[0]}부 ${sec[1]}`};
}
const lawQ=LAW.map((x,i)=>({id:"law-"+i,t:"ox",q:x[0],a:x[1],e:x[2]}));
const valQ=VAL.map((x,i)=>Object.assign({id:"val-"+i},x));
const incoQ=INCO.map((x,i)=>Object.assign({id:"inco-"+i},x));
function byId(id){
  if(id.startsWith("hs-")){const p=id.split("-");return hsQ(+p[2],p[1])}
  return [...lawQ,...valQ,...incoQ].find(q=>q.id===id);
}

/* ---------- state ---------- */
const TABS=[["hs","관세율표"],["law","관세법 OX"],["val","관세평가"],["inco","무역영어"],["wrong","오답노트"]];
let tab="hs", hsMode="n2t", hsSecs=new Set(), showTable=false;
let session=null;
try{const t=localStorage.getItem(KEY+".tab");if(t)tab=t}catch(e){}
const TABKEYS=["hs","law","val","inco","wrong"];
function hashTab(){const h=location.hash.slice(1);return TABKEYS.includes(h)?h:null}
if(hashTab())tab=hashTab();
window.addEventListener("hashchange",()=>{const h=hashTab();if(h&&h!==tab){tab=h;showTable=false;buildSession();renderAll()}});

function buildSession(){
  let qs=[];
  if(tab==="hs"){
    let pool=CH.filter(n=>!hsSecs.size||hsSecs.has(secOf(n)[0]));
    qs=shuffle(pool).slice(0,20).map(n=>hsQ(n,hsMode));
  }else if(tab==="law")qs=shuffle(lawQ);
  else if(tab==="val")qs=shuffle(valQ);
  else if(tab==="inco")qs=shuffle(incoQ);
  else qs=shuffle(Object.keys(store.wrong)).map(byId).filter(Boolean);
  session={qs,i:0,score:0,picked:null};
}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>{
    const n=k==="wrong"?` ${Object.keys(store.wrong).length}`:"";
    return `<button data-tab="${k}" aria-pressed="${tab===k}">${l}${n}</button>`}).join("");
}
function renderControls(){
  const c=$("#controls");
  if(tab!=="hs"){c.innerHTML="";c.hidden=true;return}
  c.hidden=false;
  c.innerHTML=`<div class="row" style="width:100%"><span class="label">방향</span>
   <button class="chip" data-mode="n2t" aria-pressed="${hsMode==="n2t"}">번호 → 품목</button>
   <button class="chip" data-mode="t2n" aria-pressed="${hsMode==="t2n"}">품목 → 번호</button>
   <button class="chip" data-table aria-pressed="${showTable}">전체 표 보기</button></div>
   <div class="row"><span class="label">범위 (부)</span>
   <button class="chip" data-sec="all" aria-pressed="${!hsSecs.size}">전체</button>
   ${SECTIONS.map(s=>`<button class="chip" data-sec="${s[0]}" aria-pressed="${hsSecs.has(s[0])}" title="${esc(s[1])}">${s[0]}부</button>`).join("")}</div>`;
}
function renderTable(){
  let h=`<div class="card"><div class="tablewrap"><table>`;
  for(const s of SECTIONS){
    if(hsSecs.size&&!hsSecs.has(s[0]))continue;
    h+=`<tr class="sec"><th colspan="2">제${s[0]}부 · ${esc(s[1])} (${s[2]}~${s[3]}류)</th></tr>`;
    for(let n=s[2];n<=s[3];n++){
      h+=`<tr><td class="n">${String(n).padStart(2,"0")}</td><td>${HS[n]?esc(HS[n]):'<span class="note">(유보)</span>'}</td></tr>`;
    }
  }
  $("#main").innerHTML=h+`</table></div></div>`;
}
function renderQ(){
  if(tab==="hs"&&showTable)return renderTable();
  const s=session, m=$("#main");
  if(!s.qs.length){m.innerHTML=`<div class="card empty">오답이 아직 없어요. 다른 탭에서 문제를 풀면 틀린 문제가 여기 모입니다.</div>`;return}
  if(s.i>=s.qs.length){
    const pct=Math.round(s.score/s.qs.length*100);
    m.innerHTML=`<div class="card done"><div class="label">결과</div><div class="big">${s.score} / ${s.qs.length}</div>
      <div>${pct>=80?'<span class="stamp">통과</span>':`정답률 ${pct}%. 틀린 문제는 오답노트에 저장됐어요.`}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" data-restart>한 번 더</button></div></div>`;return}
  const q=s.qs[s.i], answered=s.picked!==null;
  const head=q.code?`<span class="code">${q.code}</span>${esc(q.q)}`:q.ask?`${esc(q.q)}<div class="note" style="margin-top:6px">${q.ask}</div>`:esc(q.q);
  let body;
  if(q.t==="ox"){
    body=`<div class="ox">${[1,0].map(v=>{let cls="";if(answered){if(v===q.a)cls="right";else if(v===s.picked)cls="wrong"}
      return `<button class="opt ${cls}" data-pick="${v}" ${answered?"disabled":""}>${v?"O":"X"}</button>`}).join("")}</div>`;
  }else{
    body=`<div class="opts">${q.o.map((o,i)=>{let cls="";if(answered){if(i===q.a)cls="right";else if(i===s.picked)cls="wrong"}
      return `<button class="opt ${cls}" data-pick="${i}" ${answered?"disabled":""}><span class="k">${i+1}</span><span${q.mono?' style="font-family:var(--f-mono);font-weight:600"':""}>${esc(o)}</span></button>`}).join("")}</div>`;
  }
  const fb=answered?`<div class="verdict ${s.picked===q.a?"r":"w"}">${s.picked===q.a?"정답":"오답"}</div><div class="exp">${esc(q.e)}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" data-next>다음 문제 →</button></div>`:"";
  m.innerHTML=`<div class="card"><div class="meta"><span>${s.i+1} / ${s.qs.length}</span><span>맞힘 ${s.score}</span></div>
   <div class="bar"><i style="width:${s.i/s.qs.length*100}%"></i></div><div class="q">${head}</div>${body}${fb}</div>`;
}
function renderAll(){renderTabs();renderControls();renderQ()}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;try{localStorage.setItem(KEY+".tab",tab)}catch(_){}buildSession();renderAll();return}
  if(b.dataset.mode){hsMode=b.dataset.mode;showTable=false;buildSession();renderAll();return}
  if(b.hasAttribute("data-table")){showTable=!showTable;renderAll();return}
  if(b.dataset.sec){const v=b.dataset.sec;if(v==="all")hsSecs.clear();else{const n=+v;hsSecs.has(n)?hsSecs.delete(n):hsSecs.add(n)}buildSession();renderAll();return}
  if(b.dataset.pick!==undefined&&session.picked===null){
    const q=session.qs[session.i];session.picked=+b.dataset.pick;store.solved++;
    if(session.picked===q.a){session.score++;store.correct++;if(tab==="wrong")delete store.wrong[q.id]}
    else store.wrong[q.id]=(store.wrong[q.id]||0)+1;
    save();renderTabs();renderQ();return}
  if(b.hasAttribute("data-next")){session.i++;session.picked=null;renderQ();return}
  if(b.hasAttribute("data-restart")){buildSession();renderQ();return}
});
document.addEventListener("keydown",e=>{
  if(!session||session.i>=session.qs.length)return;
  const q=session.qs[session.i];
  if(session.picked===null){
    if(q.t==="ox"&&/^[ox]$/i.test(e.key)){document.querySelector(`[data-pick="${e.key.toLowerCase()==="o"?1:0}"]`)?.click()}
    else if(q.t==="mc"&&/^[1-4]$/.test(e.key)){document.querySelector(`[data-pick="${+e.key-1}"]`)?.click()}
  }else if(e.key==="Enter"){document.querySelector("[data-next]")?.click()}
});
buildSession();renderAll();
</script>

</body></html>
